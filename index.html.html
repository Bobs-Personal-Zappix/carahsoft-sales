 function u8(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}

  return crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
   return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(key){
   return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(LOCK.i)},key,u8(LOCK.c))}).then(function(pt){return new TextDecoder().decode(pt)})}
 function show(html){var app=document.getElementById('app');app.innerHTML=html;var g=document.getElementById('gate');g.parentNode.removeChild(g);initApp()}
 var f=document.getElementById('gform'),pw=document.getElementById('gpw'),btn=document.getElementById('gbtn'),err=document.getElementById('gerr');
 if(!window.crypto||!crypto.subtle){err.textContent='This browser can’t open the toolkit. Try a current version of Chrome, Edge, Safari, or Firefox.';btn.disabled=true;return}
 try{var saved=sessionStorage.getItem('zx-wl-pw');if(saved){open(saved).then(show,function(){try{sessionStorage.removeItem('zx-wl-pw')}catch(e){}})}}catch(e){}
 f.addEventListener('submit',function(ev){ev.preventDefault();btn.disabled=true;btn.textContent='Opening…';err.textContent='';
  open(pw.value).then(function(h){try{sessionStorage.setItem('zx-wl-pw',pw.value)}catch(e){}show(h)},function(){btn.disabled=false;btn.textContent='Open toolkit';err.textContent='That password didn’t work. Check it and try again.';pw.select()})});
})();
</script>
</body></html>
